<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EG Monogram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Karla:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8f2;--ink:#2b3a55;--muted:#8a93a3}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);display:grid;place-items:center;font-family:Karla,system-ui,sans-serif;color:var(--ink)}
.stage{position:relative;width:min(420px,92vw);aspect-ratio:1/1.12;display:grid;place-items:center}
.stage::before{content:"";position:absolute;inset:6% 4%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0));pointer-events:none}
svg{position:relative;width:100%;height:100%;overflow:visible;cursor:pointer;touch-action:none;outline:none;-webkit-tap-highlight-color:transparent}
svg:focus-visible{outline:2px dashed #a9c6ea;outline-offset:6px;border-radius:24px}
.hint{position:absolute;bottom:2%;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);transition:opacity .6s}
.hint.gone{opacity:0}
.embed body{background:transparent}
.embed .stage{width:min(420px,92vw,74vh);margin-top:6vh}
</style>
</head>
<body>
<div class="stage" id="stage">
  <svg id="mark" viewBox="-160 -250 320 358" role="button" tabindex="0" aria-label="EG monogram. Hover to open the stack, move to turn it, click to spin.">
    <defs>
      <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#2b3a55" stop-opacity=".22"/>
        <stop offset="1" stop-color="#2b3a55" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
        <stop offset=".55" stop-color="#fff" stop-opacity=".12"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <ellipse id="shade" cx="0" cy="66" rx="92" ry="30" fill="url(#shadow)"/>
    <g id="tiles"></g>
  </svg>
  <div class="hint" id="hint">hover · move · click</div>
</div>

<script>
(() => {
  if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add('embed');
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const S = 2.35;                 // scale of the drawing
  const A = 20, H = 11;           // tile half-side and thickness (same as the portfolio mark)
  const GAP = 17, OPEN = 28;      // spacing closed and opened
  const C = .8660254, Sn = .5;

  // bottom to top, same colours as the portfolio monogram: top, left side, right side
  const palette = [
    ['#c9dcf3', '#a9c6ea', '#86a9d6'],
    ['#dff1e7', '#c8e6d6', '#9fd0b7'],
    ['#f8d3db', '#f2a7b5', '#e48c9d'],
    ['#f9efbd', '#f6e7a1', '#ead27c'],
  ];

  const hex = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => { const x = hex(a), y = hex(b);
    return 'rgb(' + x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(',') + ')'; };

  const root = document.getElementById('tiles');
  const svg = document.getElementById('mark');
  const shade = document.getElementById('shade');
  const hint = document.getElementById('hint');

  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

  // each tile: springs for height, turn and hover lift
  const tiles = palette.map((p, i) => {
    const g = el('g', {'stroke-linejoin': 'round'}, root);
    const sides = [0, 1, 2, 3].map(() => el('path', {'stroke-width': 5}, g));
    const top = el('path', {fill: p[0], stroke: p[0], 'stroke-width': 5}, g);
    const sheen = el('path', {fill: 'url(#sheen)'}, g);
    const edge = el('path', {fill: 'none', stroke: '#fff', 'stroke-opacity': .85, 'stroke-width': 1.4, 'stroke-linecap': 'round'}, g);
    let text = null;
    if (i === palette.length - 1) {
      text = el('text', {'text-anchor': 'middle', 'font-family': 'Fraunces,Georgia,serif', 'font-weight': 700,
        'font-size': 18, fill: '#2b3a55'}, g);
      text.textContent = 'eg';
    }
    const t = { i, p, g, sides, top, sheen, edge, text,
      z: i * GAP, vz: 0, ang: 0, va: 0, lift: 0, vl: 0, liftT: 0, spin: 0, vs: 0, spinT: 0 };
    g.addEventListener('pointerenter', () => { t.liftT = 7; });
    g.addEventListener('pointerleave', () => { t.liftT = 0; });
    return t;
  });

  // state from the pointer
  let open = false, turn = 0, tilt = 0, hovering = false, lastMove = 0;

  const project = (x, y, z) => [(x - y) * C * S, ((x + y) * Sn - z) * S];
  const pts = a => a.map(p => p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join(' L ');

  function draw(t) {
    const th = t.ang + t.spin;
    const cs = Math.cos(th), sn = Math.sin(th);
    const corners = [[-A, -A], [A, -A], [A, A], [-A, A]].map(([x, y]) => [x * cs - y * sn, x * sn + y * cs]);
    const zt = t.z + t.lift + H, zb = t.z + t.lift;

    // sides facing the viewer: outward normal points down the screen
    const faces = [];
    for (let k = 0; k < 4; k++) {
      const a = corners[k], b = corners[(k + 1) % 4];
      const ex = b[0] - a[0], ey = b[1] - a[1], len = Math.hypot(ex, ey);
      const nx = ey / len, ny = -ex / len;        // outward for this winding
      const facing = nx + ny;
      faces.push({ a, b, nx, ny, facing });
    }
    faces.sort((f, g) => f.facing - g.facing);
    const front = [];
    faces.forEach((f, k) => {
      const path = t.sides[k];
      if (f.facing <= 0.001) { path.setAttribute('d', ''); return; }
      const shadeT = Math.min(1, Math.max(0, (f.nx - f.ny + 1) / 2));
      const col = mix(t.p[1], t.p[2], shadeT);
      path.setAttribute('fill', col); path.setAttribute('stroke', col);
      path.setAttribute('d', 'M ' + pts([project(...f.a, zt), project(...f.b, zt), project(...f.b, zb), project(...f.a, zb)]) + ' Z');
      front.push(f);
    });

    const topPts = corners.map(c => project(c[0], c[1], zt));
    const d = 'M ' + pts(topPts) + ' Z';
    t.top.setAttribute('d', d); t.sheen.setAttribute('d', d);

    // soft white rim along the front edges of the top face
    t.edge.setAttribute('d', front.map(f => {
      const a = project(f.a[0] * .96, f.a[1] * .96, zt), b = project(f.b[0] * .96, f.b[1] * .96, zt);
      return 'M ' + pts([a, b]);
    }).join(' '));

    if (t.text) {
      const [cx, cy] = project(0, 0, zt);
      const deg = th * 180 / Math.PI;
      t.text.setAttribute('transform',
        `translate(${cx.toFixed(2)} ${cy.toFixed(2)}) scale(${S}) matrix(${C} ${Sn} ${-C} ${Sn} 0 0) rotate(${deg.toFixed(2)}) translate(0 6)`);
    }
  }

  function spring(t, key, vkey, target, k, damp) {
    t[vkey] += (target - t[key]) * k;
    t[vkey] *= damp;
    t[key] += t[vkey];
  }

  // click or tap: the top tile hops and spins, the rest bounce in a cascade
  function play() {
    hint.classList.add('gone');
    const top = tiles[tiles.length - 1];
    top.spinT += Math.PI * 2;
    tiles.forEach((t, i) => setTimeout(() => { t.vz += reduce ? 0 : 5 + i * 1.6; }, (tiles.length - 1 - i) * 70));
  }

  svg.addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
    turn = px * 1.1; tilt = py; lastMove = performance.now();
    hint.classList.add('gone');
  });
  svg.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') { hovering = true; open = true; } });
  svg.addEventListener('pointerleave', () => { hovering = false; open = false; turn = 0; tilt = 0; });
  svg.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse') open = !open;   // touch: tap opens or closes the stack
    play();
  });
  svg.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open = !open; play(); }
  });

  const t0 = performance.now();
  function frame(now) {
    const s = (now - t0) / 1000;
    const idle = !hovering && now - lastMove > 1200;
    const sway = reduce ? 0 : (idle ? Math.sin(s * .6) * .16 : 0);
    const breathe = reduce ? 0 : Math.sin(s * 1.4) * 1.6;
    const gap = open ? OPEN + tilt * 10 : GAP;
    const k = reduce ? .3 : .085, damp = reduce ? .5 : .8;

    tiles.forEach((t, i) => {
      const target = i * gap + (open ? 0 : breathe * i * .35) + (reduce ? 0 : Math.sin(s * 1.1) * 3);
      spring(t, 'z', 'vz', target, k, damp);
      // upper tiles follow the turn a little later, which gives a soft twist
      spring(t, 'ang', 'va', turn + sway, k * (1 - i * .14), damp);
      spring(t, 'lift', 'vl', open ? t.liftT : 0, .12, .78);
      spring(t, 'spin', 'vs', t.spinT, reduce ? .3 : .05, reduce ? .5 : .82);
      draw(t);
    });

    const h = tiles[0].z;
    const sc = 1 - Math.min(.25, Math.max(0, h) / 60);
    shade.setAttribute('rx', (92 * sc).toFixed(1));
    shade.setAttribute('ry', (30 * sc).toFixed(1));
    shade.setAttribute('opacity', (.6 + .4 * sc).toFixed(2));

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
